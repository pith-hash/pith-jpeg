[package]
name = "pith-jpeg"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "pith jpeg lane: baseline and progressive JPEG decoding, byte-exact with libjpeg islow (zero-dep Rust)"
readme = "README.md"
license = "MIT"
repository = "https://github.com/pith-hash/pith-jpeg"
homepage = "https://pith-jpeg.n24q02m.com"
categories = ["algorithms", "multimedia::encoding"]

[lib]
# The cdylib is the binary every language SDK binds through (ctypes,
# koffi, cgo); the rlib keeps the Rust consumers unchanged.
crate-type = ["cdylib", "rlib"]

[dependencies]
pith-digest = { version = "0.1", git = "https://github.com/pith-hash/pith-digest.git", branch = "main" }
pith-image = { version = "0.1", git = "https://github.com/pith-hash/pith-image.git", branch = "main" }
# The orthonormal f64 DCT-III oracle backing `src/reference.rs`: the
# decode path itself is libjpeg's fixed-point islow transcription and
# never calls it (see src/idct.rs).
pith-math = { version = "0.1", git = "https://github.com/pith-hash/pith-math.git", branch = "main" }

[[bin]]
name = "gen-reference"
path = "tools/gen-reference/main.rs"

[profile.release]
lto = true
codegen-units = 1

# Ported from the upstream suite: the conformance harness (strict-prefix
# scan + 20k-mutation storm) decodes thousands of streams; under -O0 the
# fixed-point inner loops are unrealistically slow.
[profile.test]
opt-level = 2

# `unsafe_code` is denied at the crate root (`#![deny(unsafe_code)]` in
# src/lib.rs), with the single `#![allow(unsafe_code)]` confined to
# src/ffi.rs, the C ABI surface. It cannot live here: `[lints]` entries
# become command-line flags, and command-line lints cannot be
# re-allowed by inner attributes.
[lints.rust]
missing_docs = "deny"
